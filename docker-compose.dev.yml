version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tailor-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tailor_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tailor-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data-dev:
  redis-data:
